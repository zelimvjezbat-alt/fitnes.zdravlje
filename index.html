
<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>G3L4US Trening</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #dbeafe;
      --primary-dark: #1e40af;
      --border: #e2e8f0;
      --border-light: #f1f5f9;
      --delete: #ef4444;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      --radius: 10px;
    }

    body.dark {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: #1e3a5f;
      --primary-dark: #60a5fa;
      --border: #334155;
      --border-light: #1e293b;
      --delete: #f87171;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 640px;
      margin: 0 auto;
      padding: 18px 20px 28px;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 12px;
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .logo span {
      background: var(--primary);
      color: #fff;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.95rem;
      letter-spacing: 0.06em;
    }

    .theme-toggle {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .theme-toggle:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
      font-size: 0.78rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 15px;
      background: var(--card-bg);
      color: var(--text);
      -webkit-appearance: none;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    textarea {
      resize: vertical;
      min-height: 64px;
    }

    button {
      padding: 12px 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
    }

    button:hover {
      background: var(--primary-hover);
    }

    .pdf-btn {
      background: var(--primary-dark);
      width: 100%;
      margin-top: 8px;
      font-size: 16px;
      padding: 14px;
    }

    .pdf-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .add-btn {
      background: var(--primary);
      width: 100%;
      margin-top: 8px;
      padding: 11px;
      font-size: 14px;
    }

    .exercise-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px 12px 12px;
      margin-bottom: 10px;
      position: relative;
      box-shadow: var(--shadow);
    }

    .exercise-card .row {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
      padding-right: 28px;
    }

    .exercise-card .name-input {
      flex: 1;
      min-width: 0;
    }

    .exercise-card .sets-wrap {
      position: relative;
      width: 92px;
      flex-shrink: 0;
    }

    .sets-input {
      width: 100%;
      text-align: center;
      font-weight: 600;
      cursor: pointer;
    }

    .sets-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.14);
      z-index: 50;
      max-height: 200px;
      overflow-y: auto;
      margin-top: 3px;
    }

    .sets-dropdown.show {
      display: block;
    }

    .sets-option {
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      border-bottom: 1px solid var(--border-light);
    }

    .sets-option:last-child {
      border-bottom: none;
    }

    .sets-option:hover {
      background: var(--primary-light);
      color: var(--primary);
    }

    .note-input {
      width: 100%;
      font-size: 13px;
      padding: 8px 11px;
    }

    .delete-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
      font-size: 18px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .delete-btn:hover {
      background: var(--delete);
      color: #fff;
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--primary-dark);
      color: #fff;
      padding: 12px 22px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 1000;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* =========================
       PDF PREVIEW
       ========================= */

    #preview {
      width: 794px;
      min-height: 1122px;
      position: fixed;
      left: -10000px;
      top: 0;
      overflow: hidden;
      background: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #preview .bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    #preview .pdf-content {
      position: relative;
      z-index: 1;
      padding: 42px 48px;
      min-height: 1122px;
    }

    #preview .pdf-header {
      text-align: center;
      margin-bottom: 26px;
      padding-bottom: 14px;
      border-bottom: 2px solid rgba(255,255,255,0.55);
    }

    #preview .pdf-title {
      font-size: 26px;
      font-weight: 900;
      color: #fff;
      margin-bottom: 10px;
      text-shadow:
        0 0 6px #000,
        -1px -1px 0 #000,
        1px 1px 0 #000;
    }

    #preview .pdf-meta {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      text-shadow:
        0 0 4px #000,
        -1px -1px 0 #000,
        1px 1px 0 #000;
      line-height: 1.5;
    }

    #preview .pdf-section {
      background: rgba(0,0,0,0.48);
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }

    #preview .pdf-section-title {
      font-size: 17px;
      font-weight: 900;
      color: #ffeb3b;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid #ffeb3b;
      text-shadow:
        0 0 3px #000,
        -1px -1px 0 #000,
        1px 1px 0 #000;
    }

    #preview .pdf-text {
      font-size: 14px;
      line-height: 1.55;
      color: #f1f5f9;
      white-space: pre-wrap;
      text-shadow: 0 0 2px #000;
    }

    #preview .pdf-exercise {
      background: rgba(255,255,255,0.10);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 8px;
      border-left: 4px solid #ffeb3b;
    }

    #preview .pdf-exercise:last-child {
      margin-bottom: 0;
    }

    #preview .pdf-exercise-name {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 0 2px #000;
    }

    #preview .pdf-exercise-sets {
      font-weight: 600;
      color: #ffeb3b;
      margin-left: 6px;
    }

    #preview .pdf-exercise-note {
      font-size: 13px;
      color: #e2e8f0;
      margin-top: 3px;
      text-shadow: 0 0 2px #000;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px 14px 24px;
      }

      .logo {
        font-size: 1.2rem;
      }

      .form-row {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .exercise-card .row {
        flex-direction: column;
        padding-right: 0;
      }

      .exercise-card .sets-wrap {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="header-row">
    <div class="logo">
      G3L4US <span>TRENING</span>
    </div>

    <button
      class="theme-toggle"
      onclick="toggleTheme()"
      id="themeBtn"
    >
      Tamno
    </button>
  </div>


  <div class="form-row">

    <div class="form-group" style="margin:0">
      <label>Ime klijenta</label>

      <input
        type="text"
        id="clientName"
        placeholder="npr. Marko"
      >
    </div>


    <div class="form-group" style="margin:0">
      <label>Datum</label>

      <input
        type="date"
        id="date"
      >
    </div>

  </div>


  <div class="form-group">

    <label>Naziv treninga</label>

    <input
      type="text"
      id="title"
      placeholder="npr. Donji dio - Snaga"
      value="Tjedni trening"
    >

  </div>


  <div class="form-group">

    <label>Uvod / Zagrijavanje</label>

    <textarea
      id="uvod"
      rows="2"
      placeholder="5 min trcanje, mobilnost..."
    ></textarea>

  </div>


  <div class="form-group">

    <label>Glavni dio</label>

    <div id="exercisesContainer"></div>

    <button
      type="button"
      class="add-btn"
      onclick="addExercise()"
    >
      + Dodaj vjezbu
    </button>

  </div>


  <div class="form-group">

    <label>Kraj / Cool-down</label>

    <textarea
      id="kraj"
      rows="2"
      placeholder="Stretching, foam rolling..."
    ></textarea>

  </div>


  <button
    class="pdf-btn"
    id="pdfBtn"
    onclick="downloadPDF()"
  >
    Generiraj i preuzmi PDF
  </button>


  <!-- =========================
       PDF PREVIEW
       ========================= -->

  <div id="preview">

    <img
      class="bg-img"
      src="pozadina.jpg"
      alt=""
    >

    <div class="pdf-content">

      <div class="pdf-header">

        <div
          class="pdf-title"
          id="previewTitle"
        ></div>

        <div class="pdf-meta">

          <strong>Klijent:</strong>
          <span id="previewClient"></span>

          <br>

          <strong>Datum:</strong>
          <span id="previewDate"></span>

        </div>

      </div>


      <div id="previewWorkout"></div>

    </div>

  </div>


  <div
    id="toast"
    class="toast"
  >
    PDF uspjesno spremljen!
  </div>


  <script>

    const SVE_VJEZBE = [
      "BENCH PRESS(BARBELL)",
      "BENCH PRESS(DUMBBELL)",
      "BENT OVER ROW(BARBELL)",
      "BICEPS CURL(DUMBBELL)",
      "CABLE FLY",
      "DEADLIFT",
      "FACE PULL",
      "INCLINE BENCH PRESS",
      "HAMMER CURL",
      "LAT PULLDOWN",
      "LATERAL RAISE",
      "LEG EXTENSION",
      "LEG PRESS",
      "LYING LEG CURL",
      "SEATED CABLE ROW",
      "SHOULDER PRESS",
      "SQUAT",
      "TRICEPS PUSHDOWN",
      "AB SCISSOR",
      "AB WHEEL",
      "AIR BIKE",
      "BACK EXTENSION",
      "BYCYCLE CRUNCH",
      "BIRD DOG",
      "BULGARIAN SPLIT SQUAT",
      "CHEST FLY(MACHINE)",
      "CHEST FLY(DUMBBELL)",
      "CRUNCH",
      "DEAD BUG",
      "FIRE HYDRANT",
      "HEEL TOUCH",
      "HIP ABDUCTION",
      "HIP ADDUCTION",
      "HIP THRUST",
      "ISOLATERAL ROW",
      "JACKKNIFE",
      "LEG RAISE",
      "LUNGE",
      "MOUNTAIN CLIMBER",
      "PREACHER CURL",
      "REAR KICK",
      "RUSSIAN TWIST",
      "TREADMILL"
    ];


    const SETOVI = [
      "3x8",
      "3x10",
      "3x12",
      "4x6",
      "4x8",
      "2x20",
      "10min",
      "5min",
      "2x10",
      "2x15",
      "max",
      "2x6",
      "2x8"
    ];


    function toggleTheme() {

      document.body.classList.toggle("dark");

      const isDark =
        document.body.classList.contains("dark");

      localStorage.setItem(
        "theme",
        isDark ? "dark" : "light"
      );

      document.getElementById(
        "themeBtn"
      ).textContent =
        isDark ? "Svijetlo" : "Tamno";
    }


    if (
      localStorage.getItem("theme") === "dark"
    ) {

      document.body.classList.add("dark");

      document.getElementById(
        "themeBtn"
      ).textContent = "Svijetlo";
    }


    document.getElementById(
      "date"
    ).valueAsDate = new Date();


    let exerciseCount = 0;


    function addExercise(
      name = "",
      sets = "",
      note = ""
    ) {

      exerciseCount++;

      const id = exerciseCount;

      const card =
        document.createElement("div");

      card.className =
        "exercise-card";

      card.id =
        "exercise-" + id;


      let opts = "";

      for (
        let i = 0;
        i < SVE_VJEZBE.length;
        i++
      ) {

        opts +=
          '<option value="' +
          escapeHtmlAttr(
            SVE_VJEZBE[i]
          ) +
          '">';
      }


      let setBtns = "";

      for (
        let j = 0;
        j < SETOVI.length;
        j++
      ) {

        setBtns +=
          '<div class="sets-option" ' +
          'onclick="setSets(' +
          id +
          ', \'' +
          SETOVI[j] +
          '\')">' +
          SETOVI[j] +
          '</div>';
      }


      card.innerHTML =

        '<button type="button" ' +
        'class="delete-btn" ' +
        'onclick="removeExercise(' +
        id +
        ')" ' +
        'title="Obrisi">×</button>' +

        '<div class="row">' +

        '<input ' +
        'list="vjezbe-list-' +
        id +
        '" ' +
        'type="text" ' +
        'class="name-input" ' +
        'placeholder="Utipkaj vjezbu..." ' +
        'value="' +
        escapeHtmlAttr(name) +
        '">' +

        '<datalist id="vjezbe-list-' +
        id +
        '">' +
        opts +
        '</datalist>' +

        '<div class="sets-wrap">' +

        '<input ' +
        'type="text" ' +
        'class="sets-input" ' +
        'placeholder="serije" ' +
        'value="' +
        escapeHtmlAttr(sets) +
        '" ' +
        'readonly ' +
        'onclick="toggleSetsDropdown(' +
        id +
        ')" ' +
        'id="sets-input-' +
        id +
        '">' +

        '<div ' +
        'class="sets-dropdown" ' +
        'id="sets-drop-' +
        id +
        '">' +
        setBtns +
        '</div>' +

        '</div>' +

        '</div>' +

        '<input ' +
        'type="text" ' +
        'class="note-input" ' +
        'placeholder="Biljeska (opcionalno)" ' +
        'value="' +
        escapeHtmlAttr(note) +
        '">';


      document
        .getElementById(
          "exercisesContainer"
        )
        .appendChild(card);
    }


    function escapeHtmlAttr(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }


    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }


    function toggleSetsDropdown(id) {

      const all =
        document.querySelectorAll(
          ".sets-dropdown.show"
        );

      for (
        let i = 0;
        i < all.length;
        i++
      ) {

        if (
          all[i].id !==
          "sets-drop-" + id
        ) {

          all[i].classList.remove(
            "show"
          );
        }
      }


      const drop =
        document.getElementById(
          "sets-drop-" + id
        );

      if (drop) {
        drop.classList.toggle("show");
      }
    }


    function setSets(id, value) {

      const input =
        document.getElementById(
          "sets-input-" + id
        );

      if (input) {
        input.value = value;
      }


      const drop =
        document.getElementById(
          "sets-drop-" + id
        );

      if (drop) {
        drop.classList.remove("show");
      }
    }


    document.addEventListener(
      "click",
      function(e) {

        if (
          !e.target.closest ||
          !e.target.closest(".sets-wrap")
        ) {

          const all =
            document.querySelectorAll(
              ".sets-dropdown.show"
            );

          for (
            let i = 0;
            i < all.length;
            i++
          ) {

            all[i].classList.remove(
              "show"
            );
          }
        }
      }
    );


    function removeExercise(id) {

      const card =
        document.getElementById(
          "exercise-" + id
        );

      if (card) {
        card.remove();
      }
    }


    addExercise();


    function getExercises() {

      const cards =
        document.querySelectorAll(
          ".exercise-card"
        );

      const exercises = [];


      for (
        let i = 0;
        i < cards.length;
        i++
      ) {

        const name =
          cards[i]
            .querySelector(".name-input")
            .value
            .trim();

        const sets =
          cards[i]
            .querySelector(".sets-input")
            .value
            .trim();

        const note =
          cards[i]
            .querySelector(".note-input")
            .value
            .trim();


        if (name) {

          exercises.push({
            name: name,
            sets: sets,
            note: note
          });
        }
      }


      return exercises;
    }


    function fillPreview() {

      const client =
        document.getElementById(
          "clientName"
        ).value ||
        "Klijent";

      const date =
        document.getElementById(
          "date"
        ).value;

      const title =
        document.getElementById(
          "title"
        ).value ||
        "Trening";

      const uvod =
        document.getElementById(
          "uvod"
        ).value;

      const kraj =
        document.getElementById(
          "kraj"
        ).value;

      const exercises =
        getExercises();


      if (
        exercises.length === 0 &&
        !uvod.trim() &&
        !kraj.trim()
      ) {

        return false;
      }


      document.getElementById(
        "previewTitle"
      ).textContent =
        title;


      document.getElementById(
        "previewClient"
      ).textContent =
        client;


      document.getElementById(
        "previewDate"
      ).textContent =
        date ||
        "Nije naveden";


      let html = "";


      if (uvod.trim()) {

        html +=
          '<div class="pdf-section">' +

          '<div class="pdf-section-title">' +
          "Uvod / Zagrijavanje" +
          "</div>" +

          '<div class="pdf-text">' +
          escapeHtml(uvod) +
          "</div>" +

          "</div>";
      }


      if (exercises.length > 0) {

        html +=
          '<div class="pdf-section">' +

          '<div class="pdf-section-title">' +
          "Glavni dio" +
          "</div>";


        for (
          let i = 0;
          i < exercises.length;
          i++
        ) {

          const ex =
            exercises[i];


          html +=
            '<div class="pdf-exercise">' +

            '<div class="pdf-exercise-name">' +

            escapeHtml(ex.name);


          if (ex.sets) {

            html +=
              '<span class="pdf-exercise-sets">' +
              " – " +
              escapeHtml(ex.sets) +
              "</span>";
          }


          html += "</div>";


          if (ex.note) {

            html +=
              '<div class="pdf-exercise-note">' +
              escapeHtml(ex.note) +
              "</div>";
          }


          html += "</div>";
        }


        html += "</div>";
      }


      if (kraj.trim()) {

        html +=
          '<div class="pdf-section">' +

          '<div class="pdf-section-title">' +
          "Kraj / Cool-down" +
          "</div>" +

          '<div class="pdf-text">' +
          escapeHtml(kraj) +
          "</div>" +

          "</div>";
      }


      document.getElementById(
        "previewWorkout"
      ).innerHTML =
        html;


      return true;
    }


    function showToast(msg) {

      const t =
        document.getElementById(
          "toast"
        );

      t.textContent =
        msg ||
        "PDF uspjesno spremljen!";

      t.classList.add("show");


      setTimeout(
        function() {

          t.classList.remove("show");

        },
        2800
      );
    }


    /*
     * ============================
     * NOVI PDF SUSTAV
     * ============================
     *
     * Više NE koristimo html2pdf().
     *
     * HTML -> html2canvas -> PNG -> jsPDF
     *
     * To izbjegava problem s praznom
     * stranicom koji se događao s
     * html2pdf klonom.
     */

    async function downloadPDF() {

      if (!fillPreview()) {

        alert(
          "Upisi barem jednu vjezbu ili uvod/kraj!"
        );

        return;
      }


      const btn =
        document.getElementById(
          "pdfBtn"
        );


      btn.disabled = true;

      btn.textContent =
        "Generiram PDF...";


      const preview =
        document.getElementById(
          "preview"
        );


      try {

        /*
         * Postavimo preview privremeno
         * na normalnu vidljivu poziciju
         * izvan glavnog sadržaja.
         *
         * NEMA opacity: 0.
         * NEMA z-index: -1.
         */

        const oldLeft =
          preview.style.left;

        const oldTop =
          preview.style.top;

        const oldPosition =
          preview.style.position;

        const oldVisibility =
          preview.style.visibility;


        preview.style.position =
          "absolute";

        preview.style.left =
          "0px";

        preview.style.top =
          "0px";

        preview.style.visibility =
          "visible";


        /*
         * Čekamo da browser napravi layout.
         */

        await new Promise(
          resolve =>
            requestAnimationFrame(
              () =>
                requestAnimationFrame(
                  resolve
                )
            )
        );


        /*
         * Čekamo i pozadinsku sliku.
         */

        const bg =
          preview.querySelector(
            ".bg-img"
          );


        if (
          bg &&
          !bg.complete
        ) {

          await new Promise(
            resolve => {

              bg.onload =
                resolve;

              bg.onerror =
                resolve;

              setTimeout(
                resolve,
                3000
              );
            }
          );
        }


        /*
         * Dodatno čekanje za fontove.
         */

        if (
          document.fonts &&
          document.fonts.ready
        ) {

          await document.fonts.ready;
        }


        /*
         * Renderiranje cijelog previewa.
         */

        const canvas =
          await html2canvas(
            preview,
            {

              scale: 2,

              useCORS: true,

              allowTaint: true,

              backgroundColor:
                "#111111",

              logging: false,

              width: 794,

              height: 1122,

              windowWidth: 794,

              windowHeight: 1122,

              scrollX: 0,

              scrollY: 0
            }
          );


        /*
         * Vraćamo preview u prvobitno stanje.
         */

        preview.style.left =
          oldLeft;

        preview.style.top =
          oldTop;

        preview.style.position =
          oldPosition;

        preview.style.visibility =
          oldVisibility;


        /*
         * Provjera da canvas nije prazan.
         */

        if (
          !canvas ||
          canvas.width === 0 ||
          canvas.height === 0
        ) {

          throw new Error(
            "Canvas je prazan."
          );
        }


        /*
         * Pretvaramo canvas u JPEG.
         */

        const imgData =
          canvas.toDataURL(
            "image/jpeg",
            0.98
          );


        /*
         * Kreiramo A4 PDF.
         */

        const {
          jsPDF
        } = window.jspdf;


        const pdf =
          new jsPDF({
            orientation:
              "portrait",

            unit:
              "mm",

            format:
              "a4",

            compress:
              true
          });


        const pageWidth =
          pdf.internal.pageSize
            .getWidth();

        const pageHeight =
          pdf.internal.pageSize
            .getHeight();


        /*
         * Malo unutarnje margine.
         */

        const margin = 5;

        const pdfWidth =
          pageWidth -
          margin * 2;

        const pdfHeight =
          pageHeight -
          margin * 2;


        /*
         * Omjer canvas -> A4.
         */

        const canvasRatio =
          canvas.width /
          canvas.height;

        const pdfRatio =
          pdfWidth /
          pdfHeight;


        let drawWidth;
        let drawHeight;
        let x;
        let y;


        if (
          canvasRatio >
          pdfRatio
        ) {

          drawWidth =
            pdfWidth;

          drawHeight =
            pdfWidth /
            canvasRatio;

          x =
            margin;

          y =
            margin +
            (
              pdfHeight -
              drawHeight
            ) / 2;

        } else {

          drawHeight =
            pdfHeight;

          drawWidth =
            pdfHeight *
            canvasRatio;

          x =
            margin +
            (
              pdfWidth -
              drawWidth
            ) / 2;

          y =
            margin;
        }


        pdf.addImage(
          imgData,
          "JPEG",
          x,
          y,
          drawWidth,
          drawHeight
        );


        /*
         * Ime PDF-a.
         */

        const title =
          document.getElementById(
            "title"
          ).value ||
          "Trening";


        let filename =
          title
            .replace(
              /[^a-zA-Z0-9cćžšđČĆŽŠĐ ]/g,
              ""
            )
            .trim();


        if (!filename) {
          filename = "Trening";
        }


        pdf.save(
          filename + ".pdf"
        );


        showToast(
          "PDF uspjesno spremljen!"
        );


      } catch (error) {

        console.error(
          "PDF ERROR:",
          error
        );


        /*
         * Obavezno vratimo preview
         * ako se dogodila greška.
         */

        preview.style.left =
          "-10000px";

        preview.style.top =
          "0px";


        alert(
          "Greška pri generiranju PDF-a: " +
          error.message
        );


      } finally {

        btn.disabled =
          false;

        btn.textContent =
          "Generiraj i preuzmi PDF";
      }
    }


    /*
     * ============================
     * UČITAVANJE PODATAKA IZ HASH-a
     * ============================
     */

    window.onload =
      function() {

        if (
          window.location.hash
        ) {

          try {

            const encoded =
              window.location.hash
                .substring(1);


            const data =
              JSON.parse(
                decodeURIComponent(
                  escape(
                    atob(encoded)
                  )
                )
              );


            document.getElementById(
              "clientName"
            ).value =
              data.client || "";


            document.getElementById(
              "date"
            ).value =
              data.date || "";


            document.getElementById(
              "title"
            ).value =
              data.title ||
              "";


            document.getElementById(
              "uvod"
            ).value =
              data.uvod ||
              "";


            document.getElementById(
              "kraj"
            ).value =
              data.kraj ||
              "";


            document.getElementById(
              "exercisesContainer"
            ).innerHTML =
              "";


            exerciseCount = 0;


            if (
              data.exercises &&
              data.exercises.length
            ) {

              for (
                let i = 0;
                i <
                data.exercises.length;
                i++
              ) {

                addExercise(
                  data.exercises[i].name ||
                    "",

                  data.exercises[i].sets ||
                    "",

                  data.exercises[i].note ||
                    ""
                );
              }

            } else {

              addExercise();
            }


          } catch (e) {

            console.error(
              "Greška pri učitavanju:",
              e
            );
          }
        }
      };

  </script>

</body>
